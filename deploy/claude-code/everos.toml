# EverOS for Claude Code with the Anthropic API and a local embedding server.
# Secrets are not kept here: start.sh passes ANTHROPIC_API_KEY to the server as
# EVEROS_LLM__API_KEY, EVEROS_DECIDER__API_KEY and EVEROS_MULTIMODAL__API_KEY.

[api]
host = "127.0.0.1"
port = 8000

[llm]
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com/v1/"
# Every Claude 5.5 model answers HTTP 400 to a sampling `temperature`.
temperature_supported = false
recursive_schemas_supported = false
pdf_input_supported = false
timeout_seconds = 120.0

[decider]
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com/v1/"
temperature_supported = false
recursive_schemas_supported = false
pdf_input_supported = false

[multimodal]
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com/v1/"
temperature_supported = false
recursive_schemas_supported = false
pdf_input_supported = false

[embedding]
# The local embedding server of embed/start.sh (or one shared by every project).
model = "BAAI/bge-m3"
base_url = "http://127.0.0.1:7997"
api_key = "local"
dim = 1024

[rerank]
provider = "vllm"
model = "BAAI/bge-reranker-v2-m3"
base_url = "http://127.0.0.1:7997"
api_key = "local"
